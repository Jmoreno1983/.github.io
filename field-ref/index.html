<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ICI Field"/>
<meta name="theme-color" content="#101820"/>
<link rel="manifest" href="manifest.json"/>

<title>ICI Field Reference</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101820;--surface:#16202a;--card:#1c2733;--border:#2c3a48;
  --accent:#B2B4B2;--navy:#101820;--hi:#FFFFFF;--hi-dim:#C9CED3;--muted:#9AA4AE;
  --text:#FFFFFF;--text-dim:#D3D8DC;
  --green:#34c759;--green-bg:#0a2010;
  --fail:#ff453a;--fail-bg:#2a0808;
  --warn:#ffd60a;--warn-bg:#1e1800;
}
html,body{height:100%;width:100%;background:var(--bg);overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;font-family:-apple-system,"SF Pro Text",sans-serif;color:var(--text)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
select{-webkit-appearance:none}
::-webkit-scrollbar{display:none}
*{-webkit-tap-highlight-color:transparent}

/* TOP BAR */
#topbar{
  background:rgba(16,24,32,0.97);border-bottom:1px solid var(--border);
  padding:10px 16px 8px;flex-shrink:0;
  padding-top:calc(env(safe-area-inset-top) + 10px);
}
#topbar-inner{display:flex;align-items:center;gap:10px;margin-bottom:0}
#logo-box{width:36px;height:36px;border-radius:8px;background:#fff;overflow:hidden;flex-shrink:0}
#logo-box img{width:100%;height:100%;display:block}
#app-name{font-size:16px;font-weight:800;color:var(--hi);letter-spacing:1.5px;line-height:1}
#app-sub{font-size:9px;color:#AEB6BE;letter-spacing:0.8px;font-family:"Courier New",monospace}
#pill-nav{display:flex;overflow-x:auto;gap:6px;margin-top:10px;scrollbar-width:none}
#pill-nav:empty{margin-top:0}
.pill{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--border);
  background:transparent;color:#AEB6BE;font-size:13px;font-weight:400;
  cursor:pointer;white-space:nowrap;font-family:-apple-system,sans-serif}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--navy);font-weight:700}

/* CONTENT */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}

/* BOTTOM TAB BAR */
#tabbar{
  display:flex;background:rgba(16,24,32,0.97);border-top:1px solid var(--border);
  padding-bottom:16px;flex-shrink:0;
}
.tab{flex:1;min-height:50px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:transparent;border:none;cursor:pointer}
.tab-ico{width:26px;height:26px;color:#7F8A95}
.tab.active .tab-ico{color:#FFFFFF}
.tab span{font-size:10px;font-weight:400;color:#AEB6BE;font-family:-apple-system,sans-serif}
.tab.active span{color:#FFFFFF;font-weight:700}

/* COMPONENTS */
.screen-title{margin-bottom:8px}
.screen-title h1{font-size:28px;font-weight:800;color:var(--hi);letter-spacing:-0.5px;margin-bottom:2px}
.screen-title p{font-size:11px;color:var(--muted);font-family:"Courier New",monospace}

.group-label{font-size:12px;font-weight:600;color:#AEB6BE;letter-spacing:0.5px;
  text-transform:uppercase;margin-top:22px;margin-bottom:6px;padding-left:4px}

.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}

.row{display:flex;align-items:center;min-height:50px;padding:0 16px;
  border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-label{font-size:16px;color:var(--text);flex:1;flex-shrink:0}
.row-value{font-size:16px;color:#CDD3D8;text-align:right;margin-left:8px;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-chevron{color:var(--muted);margin-left:6px;font-size:16px}

.row select{position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;width:100%;height:100%;font-size:16px}
.row.select-row{position:relative}

input.mono-input{flex:1;background:transparent;border:none;outline:none;
  font-size:17px;color:var(--hi);text-align:right;font-family:"Courier New",monospace;
  padding:14px 0;-webkit-appearance:none}

.fi-group{padding:8px 16px 10px}
.fi-label{font-size:14px;color:var(--muted);margin-bottom:6px;display:block}
.fi-inputs{display:flex;gap:10px}
.fi-box{flex:1;min-width:0;display:flex;align-items:center;background:rgba(255,255,255,0.04);
  border-radius:8px;padding:0 10px}
.fi-box input{flex:1;min-width:0;width:100%;background:transparent;border:none;outline:none;
  font-size:18px;color:var(--hi);font-family:"Courier New",monospace;
  padding:10px 0;-webkit-appearance:none;text-align:right}
.fi-box span{font-size:13px;color:var(--muted);margin-left:4px}

.result-card{background:var(--card);border-radius:14px;padding:18px 20px;
  margin-top:14px;text-align:center;border:1.5px solid var(--border)}
.result-card .rc-label{font-size:12px;color:var(--muted);letter-spacing:0.5px;
  text-transform:uppercase;margin-bottom:6px}
.result-card .rc-value{font-size:32px;font-weight:800;color:var(--hi);
  letter-spacing:-1px;line-height:1;font-family:-apple-system,"SF Pro Display",sans-serif}
.result-card .rc-value.big{font-size:52px}
.result-card .rc-sub{font-size:13px;color:#C2C9CF;margin-top:6px;
  font-family:"Courier New",monospace;line-height:1.4}

.info-row{display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;min-height:44px;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-row .ir-label{font-size:14px;color:#AEB6BE}
.info-row .ir-value{font-size:14px;color:#CDD3D8;font-weight:600;
  font-family:"Courier New",monospace;text-align:right;margin-left:8px}
.info-row .ir-value.gold{color:var(--hi)}

.warn-box{border-radius:10px;padding:12px 14px;margin-top:10px;
  background:var(--warn-bg);border:1px solid var(--warn);
  font-size:13px;color:var(--warn);line-height:1.5}
.warn-box.muted{background:rgba(255,255,255,0.05);border-color:#8C969F;color:#CDD2D6}
.warn-box.fail{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}

.code-note{padding:10px 4px 0;font-size:12px;color:#C4CAD0;line-height:1.5}

.allowable-banner{margin-top:16px;padding:20px;border-radius:14px;text-align:center;
  border:2px solid var(--accent);background:#16212c}
.allowable-banner .ab-label{font-size:12px;color:var(--muted);letter-spacing:0.5px;
  text-transform:uppercase;margin-bottom:6px}
.allowable-banner .ab-value{font-size:52px;font-weight:800;color:var(--hi);
  letter-spacing:-1px;line-height:1;font-family:-apple-system,"SF Pro Display",sans-serif}
.allowable-banner .ab-sub{font-size:13px;color:#C2C9CF;margin-top:6px;
  font-family:"Courier New",monospace}
.allowable-banner.preheat-ok{border-color:var(--green);background:var(--green-bg)}
.allowable-banner.preheat-ok .ab-value{color:var(--green)}
.allowable-banner.preheat-warn{border-color:var(--warn);background:var(--warn-bg)}
.allowable-banner.preheat-warn .ab-value{color:var(--warn)}
.allowable-banner.rejectable{border-color:var(--fail);background:var(--fail-bg)}
.allowable-banner.rejectable .ab-value{font-size:28px;color:var(--fail)}
.allowable-banner.not-recommended{border-color:var(--fail);background:var(--fail-bg)}
.allowable-banner.not-recommended .ab-value{font-size:22px;color:var(--fail);line-height:1.3}
</style>
</head>

function dtf(dec) {
  if (isNaN(dec)||dec===0) return dec===0?'0"':"—";
  const dens=[2,4,8,16,32];
  for(const d of dens){
    const n=Math.round(dec*d);
    if(Math.abs(n/d-dec)<0.0005){
      const w=Math.floor(n/d),r=n%d;
      if(r===0)return w+'"';
      if(w===0)return r+'/'+d+'"';
      return w+'-'+r+'/'+d+'"';
    }
  }
  return dec.toFixed(3)+'"';
}
function fmt(v,d=4){return isNaN(v)?"—":v.toFixed(d)}
function fi(ft,inch){return (parseFloat(ft)||0)*12+(parseFloat(inch)||0)}
function pf(s){
  if(!s)return NaN;
  s=s.trim();
  if(s==="1-0")return 1.0;
  if(s.includes("-")){const[w,f]=s.split("-");const[n,d]=f.split("/");return parseInt(w)+parseInt(n)/parseInt(d);}
  if(s.includes("/")){const[n,d]=s.split("/");return parseInt(n)/parseInt(d);}
  return parseFloat(s);
}
function getPreheat(mat,grade,process,thk){
  let cat=mat.cat;
  if(mat.gradeOverride&&mat.gradeOverride[grade])cat=mat.gradeOverride[grade];
  const phRow=PH[cat];
  if(!phRow)return NaN;
  const vals=process==="SMAW (non-LH)"?phRow.nonLH:phRow.LH;
  if(vals==="NOT_RECOMMENDED")return "NOT_RECOMMENDED";
  const t=parseFloat(thk);
  if(isNaN(t))return NaN;
  if(t<=0.75)return vals[0];
  if(t<=1.5) return vals[1];
  if(t<=2.5) return vals[2];
  return vals[3];
}

function el(tag,attrs={},children=[]){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object"){Object.assign(e.style,v);}
    else if(k.startsWith("on")){e.addEventListener(k.slice(2).toLowerCase(),v);}
    else{e.setAttribute(k,v);}
  }
  for(const c of children){
    if(c===null||c===undefined)continue;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return e;
}
function div(cls,children=[]){const e=el("div");e.className=cls;for(const c of children)if(c)e.appendChild(typeof c==="string"?document.createTextNode(c):c);return e;}
function text(tag,cls,txt){const e=document.createElement(tag);e.className=cls;e.textContent=txt;return e;}

function selectRow(label,options,selected,onChange,last=false){
  const row=div("row select-row",[]);
  const lbl=el("span",{class:"row-label"},[label]);
  // Show the label (not the value) for the selected option
  const matchedLabel=(options.find(o=>(o.v||o)===selected)||options[0]);
  const displayLabel=matchedLabel?(matchedLabel.l||matchedLabel):selected;
  const val=el("span",{class:"row-value"},[String(displayLabel)]);
  const chev=el("span",{class:"row-chevron"},["›"]);
  const sel=el("select");
  for(const o of options){
    const opt=el("option",{value:o.v||o},[o.l||o]);
    if((o.v||o)===selected)opt.selected=true;
    sel.appendChild(opt);
  }
  sel.addEventListener("change",e=>{val.textContent=e.target.options[e.target.selectedIndex].text;onChange(e.target.value);});
  row.appendChild(lbl);row.appendChild(val);row.appendChild(chev);row.appendChild(sel);
  if(last)row.style.borderBottom="none";
  return row;
}

function renderPreheat(){
  const s=state.preheat;
  const frag=document.createDocumentFragment();
  frag.appendChild(screenTitle("Preheat","AWS D1.1:2025 Table 5.11"));
  frag.appendChild(groupLabel("Base Metal"));
  const mat=PREHEAT_MATERIALS[s.mat];
  const allGrades=mat.gradesAll||mat.grades;
  const gradeSel=allGrades[s.grade]||allGrades[0];
  const cardRows=[
    selectRow("Material",PREHEAT_MATERIALS.map((m,i)=>({v:String(i),l:m.label})),String(s.mat),v=>{s.mat=parseInt(v);s.grade=0;render();},mat.single)
  ];
  if(!mat.single){cardRows.push(selectRow("Grade",allGrades.map(g=>({v:g,l:g})),gradeSel,v=>{s.grade=allGrades.indexOf(v);render();},true));}
  frag.appendChild(card(cardRows));

  frag.appendChild(groupLabel("Welding Process"));
  frag.appendChild(card([
    selectRow("Process",[
      {v:"SMAW",l:"SMAW — Low Hydrogen (LH)"},
      {v:"SMAW (non-LH)",l:"SMAW — Non-LH Electrodes"},
      {v:"FCAW",l:"FCAW — Flux Core"},
      {v:"GMAW",l:"GMAW — MIG"},
      {v:"SAW",l:"SAW — Submerged Arc"},
    ],s.process,v=>{s.process=v;render();},true)
  ]));

  const ph=getPreheat(mat,gradeSel,s.process,s.thk);
  const isNR=ph==="NOT_RECOMMENDED";

  if(mat.h8)frag.appendChild(warnBox('A913 REQUIREMENT: These preheat values apply ONLY when using H8 electrodes (max 8 ml/100g diffusible hydrogen per AWS A4.3). Using non-H8 consumables requires Category C preheat.'));

  if(isNR){
    frag.appendChild(allowableBanner("","Non-LH electrodes are NOT RECOMMENDED for A913 steel. Use SMAW-LH, FCAW, GMAW, or SAW with H8 electrode designation.","AWS D1.1:2025 Table 5.11 Category D/E/F","not-recommended"));
    return frag;
  }

  frag.appendChild(groupLabel("Base Metal Thickness (thickest part at weld)"));
  frag.appendChild(card([inputRow("Thickness","ph-thk","in",true)]));

  const thkVal=parseFloat(val('ph-thk'));
  const phVal=getPreheat(mat,gradeSel,s.process,thkVal);

  if(!isNaN(phVal)&&!isNaN(thkVal)){
    const ambVal=parseFloat(val('ph-amb'));
    let cls="";
    if(!isNaN(ambVal)){cls=ambVal>=phVal?"preheat-ok":"preheat-warn";}
    const sub=phVal===32?'*If steel temp below 32°F, preheat to 70°F minimum':(!isNaN(ambVal)?ambVal>=phVal?'Steel temp ('+ambVal+'°F) meets requirement':'Steel is '+ambVal+'°F — PREHEAT REQUIRED':null);
    frag.appendChild(allowableBanner("Minimum Preheat Required",phVal+"°F",sub,cls));

    if(mat.maxInterpass&&mat.maxInterpass[gradeSel])
      frag.appendChild(warnBox('A709 HPS70W: Max preheat/interpass shall not exceed 400°F for t ≤ 1-1/2", or 450°F for t > 1-1/2" — AWS D1.1:2025 Table 5.11 Note b.'));

    frag.appendChild(groupLabel("Check Steel Temperature"));
    frag.appendChild(card([inputRow("Steel / Ambient Temp","ph-amb","°F",true)]));
    frag.appendChild(groupLabel("Reference"));
    frag.appendChild(card([
      infoRow("Material",mat.label),
      infoRow("Grade",gradeSel),
      infoRow("Process",s.process),
      infoRow("Thickness",fmt(thkVal,3)+'"'),
      infoRow("Min Preheat",phVal+"°F",true),
      infoRow('Code','AWS D1.1:2025 Table 5.11',false,true),
    ]));
  } else {
    frag.appendChild(warnBox("Enter base metal thickness above to calculate preheat requirement.","muted"));
  }
  frag.appendChild(warnBox('DISSIMILAR BASE METALS — §5.7.2: When joining base metals with different minimum preheats from Table 5.11, the minimum preheat applied to the joint shall be the highest of the individual minimum preheats based on category and thickness. — AWS D1.1:2025 §5.7.2','muted'));
  return frag;
}

      infoRow("Minimum Spacing",dtf(bd*8/3)+'  (2-2/3d)',true),

      infoRow("Maximum Spacing",'Lesser of 12" or 24t',false,true),
    ]));
    frag.appendChild(warnBox('Maximum spacing: lesser of 12" or 24 times the thickness of the thinner connected part — AISC 360-22 §J3.3.',"muted"));
    frag.appendChild(codeNote("Preferred spacing of 3d avoids bolt interference and simplifies field inspection. 't' = thickness of thinner connected part — AISC 360-22 Table J3.4."));
  }
  return frag;
}


const MODULE_RENDERERS=[
  [renderPlumbness,renderSweep,renderCamber,renderSpliceGap,renderBearing,renderBasePlate,renderStuds,renderFlange],
  [renderPreheat,renderWeldVT,renderWeldSize],
  [renderHoles,renderSpacing,renderWashers,renderReuse,renderFaying,renderPIV,renderTurnNut,renderDTI],
];

// ── MAIN RENDER ───────────────────────────────────────────────────────────

// Track input values across renders — persists between render calls
const inputVals={};
function saveInputs(){
  document.querySelectorAll("input[id]").forEach(i=>{if(i.value!=="")inputVals[i.id]=i.value;});
}
function restoreInputs(){
  document.querySelectorAll("input[id]").forEach(i=>{if(inputVals[i.id]!==undefined)i.value=inputVals[i.id];});
}
// Read a stored input value (used by renderers to get current values)
function val(id){return inputVals[id]||"";}

function render(){
  const contentEl=document.getElementById("content");
  const pillNav=document.getElementById("pill-nav");

  // Save current input values FIRST before clearing DOM
  saveInputs();

  // Update tab bar
  for(let i=0;i<TABS.length;i++){
    const t=document.getElementById("tab"+i);
    if(t)t.className="tab"+(state.tab===i?" active":"");
  }

  // Update pill nav
  pillNav.innerHTML="";
  const mods=TABS[state.tab].modules;
  if(mods.length>1){
    mods.forEach((m,i)=>{
      const b=document.createElement("button");
      b.className="pill"+(state.module===i?" active":"");
      b.textContent=m;
      b.onclick=()=>{state.module=i;render();};
      pillNav.appendChild(b);
    });
  }

  // Render module
  contentEl.innerHTML="";
  const renderer=MODULE_RENDERERS[state.tab]?.[state.module];
  if(renderer){
    const frag=renderer();
    contentEl.appendChild(frag);
  }

  // Restore input values AFTER DOM is built
  restoreInputs();

  // Attach listeners — only recalculate when user leaves the field
  // Using 'blur' and 'change' prevents keyboard dismissal on iOS
  contentEl.querySelectorAll("input").forEach(inp=>{
    // Show value immediately as typed (no render)
    inp.addEventListener("input",e=>{
      inputVals[e.target.id]=e.target.value;
    });
    // Recalculate when user leaves field or presses return
    inp.addEventListener("blur",e=>{
      inputVals[e.target.id]=e.target.value;
      render();
    });
    inp.addEventListener("change",e=>{
      inputVals[e.target.id]=e.target.value;
      render();
    });
  });
}

function switchTab(i){state.tab=i;state.module=0;render();}

// Initial render
render();
</script>
